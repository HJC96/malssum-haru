# 말씀하루 CI: web, services/qt, infra 검증만 한다. AWS 자격 증명과 배포 단계는 넣지 않는다.
# 배포는 비용표와 IaC 변경 내역을 사용자에게 제시하고 승인받은 뒤 사람이 별도로 실행한다.
# 액션은 커밋 SHA로 고정했다(주석은 확인한 릴리스: 2026-09-24).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint 스크립트가 생기면 실행되고, 없으면 건너뛴다. 정적 검사는 typecheck가 맡는다.
      - run: pnpm --filter malssum-haru-web run --if-present lint
      - run: pnpm --filter malssum-haru-web typecheck
      - run: pnpm --filter malssum-haru-web test
      - run: pnpm --filter malssum-haru-web build

  qt:
    name: services/qt (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/qt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify

  infra:
    name: infra (typecheck, test, synth, cost model)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CDK_DISABLE_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter malssum-haru-infra typecheck
      - run: pnpm --filter malssum-haru-infra test
      # 템플릿만 만든다. 계정에 접근하지 않는다.
      - run: pnpm --filter malssum-haru-infra synth:ci
      - run: pnpm --filter malssum-haru-infra cost:test
      # docs/cost-estimate.md 의 표가 비용 모델 결과와 같은지 확인한다(가정이나 가격을 바꾸고 문서를 안 고친 경우 실패).
      - run: pnpm --filter malssum-haru-infra cost:doc:check
